[project]
name = "timesfm-predict"
version = "0.3.0"
description = "Price prediction with TimesFM, Moirai, Kronos and Chronos-2 (time-series foundation models) + Yahoo Finance"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas>=2.2,<2.4",
    "torch>=2.2,<2.5",
    "einops==0.7.0",
    "timesfm>=2.0.2,<3",
    "uni2ts>=2.0,<3",
    "chronos-forecasting>=2.0,<3",
    "transformers>=4.41,<5",  # chronos-forecasting allows v5, but v5 needs torch>=2.5
    "huggingface_hub>=0.33,<2.0",
    "safetensors>=0.6",
    "tqdm>=4.67",
    "yfinance>=0.2.50",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# CUDA build of torch (cu124) to accelerate inference on the NVIDIA GPU.
# The torch pin is <2.5 (forced by uni2ts/lightning), so we must use the cu124
# wheelhouse: cu126/cu13x wheels only exist for torch >= 2.6.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

# AMD GPU build of torch (ROCm/HIP). A ROCm build surfaces the AMD card through
# the same "cuda" device string, so no code change is needed — the app labels
# it "AMD GPU (ROCm/HIP)". To install for AMD, comment out the CUDA index/src
# above and uncomment ONE of the blocks below matching your card, then:
#   uv sync --python 3.11 --reinstall-package torch
#
#   [[tool.uv.index]]
#   name = "pytorch-rocm56"        # RX 480/470/570/580 (Polaris, gfx803), Vega 56/64
#   url = "https://download.pytorch.org/whl/rocm5.6"
#   explicit = true
#
#   [[tool.uv.index]]
#   name = "pytorch-rocm62"        # RX 6000/7000, Instinct MI200/MI300, Vega 20+
#   url = "https://download.pytorch.org/whl/rocm6.2"
#   explicit = true
#
#   [tool.uv.sources]
#   torch = { index = "pytorch-rocm56" }

