[project]
name = "timesfm-predict"
version = "0.2.0"
description = "Price prediction with Google's TimesFM (time-series foundation model) + Yahoo Finance"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas>=2.2,<2.4",
    "torch>=2.2",
    "einops==0.8.1",
    "timesfm>=2.0.2,<3",
    "huggingface_hub>=0.33,<2.0",
    "safetensors>=0.6",
    "tqdm>=4.67",
    "yfinance>=0.2.50",
    "streamlit>=1.35",
    "plotly>=5.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# CPU-only torch: avoids downloading several GB of CUDA libraries
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
